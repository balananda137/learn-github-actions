name: ci pipeline
run-name: CI pipeline
on: [push]
jobs:
    lint:
      runs-on: self-hosted
      steps:
        - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

    build:
      needs: build
      runs-on: self-hosted
      steps:
        - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

    test:
        needs: test
        runs-on: self-hosted
        steps:
          - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

    publish:
      needs: publish
      runs-on: self-hosted
      steps:
        - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."




